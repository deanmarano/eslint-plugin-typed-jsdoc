name: Release Plan

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [labeled]

concurrency:
  group: release-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-plan:
    name: Check Release Plan
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.check-release.outputs.command }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install

      - id: check-release
        run: npx release-plan prepare --check-only 2>/dev/null || echo "command=skip" >> $GITHUB_OUTPUT

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: check-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install

      - name: Prepare Release
        run: npx release-plan prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    needs: check-plan

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install

      - name: Publish
        run: npx release-plan publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
